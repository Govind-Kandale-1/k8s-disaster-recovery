apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-full-backup
  namespace: velero
  labels:
    tier: full
    rpo: 24h
spec:
  schedule: "0 2 * * *"   # 02:00 UTC daily
  template:
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
    excludedResources:
      - events
      - events.events.k8s.io
    storageLocation: default
    volumeSnapshotLocations:
      - default
    ttl: 720h0m0s   # 30 days
    snapshotVolumes: true
    includeClusterResources: true   # CRDs, ClusterRoles, etc.
